name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle wrapper
        run: |
          cd AmbientLight
          gradle wrapper --gradle-version 8.5

      - name: Grant execute permission
        run: chmod +x AmbientLight/gradlew

      - name: Build APK
        run: |
          cd AmbientLight
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmbientLight-debug
          path: AmbientLight/app/build/outputs/apk/debug/app-debug.apk
